<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>유스플랜AI 운영 대시보드 — 목업</title>
<style>
  :root{
    --blue:#005EB8; --green:#00B2A9;
    --ink:#16181a; --ink2:#565d62; --ink3:#8a9196; --line:#e3e7ea;
    --bg:#eceff2; --card:#fff;
    --m0:#e6eaee; --m1:#86B2DC; --m2:#2A78C2; --m3:#005EB8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#dfe3e7}
  body{font:13px/1.5 -apple-system,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;color:var(--ink);
       position:relative}
  /* 1920x1080을 통째로 축소한다. 화면 폭이 1920이 아니어도 잘리지 않도록
     기준점을 왼쪽 위로 두고 중앙 배치는 translate가 맡는다. */
  #stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;background:var(--bg);
         transform-origin:top left;display:grid;grid-template-rows:60px 56px 1fr;overflow:hidden}

  .top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 26px}
  .brand{font-weight:800;color:var(--blue);font-size:19px;letter-spacing:-.02em}
  .top .t{font-size:15px;font-weight:700}
  .top .d{font-size:13px;color:var(--ink3)}
  .top .sp{flex:1}
  /* font 단축 속성에 inherit을 쓰면 선언 전체가 무효가 되어 버튼이 브라우저 기본 글꼴로
     떨어진다. 글꼴 상속은 font-family로 따로 받는다 */
  .btn{height:37px;padding:0 20px;border:0;border-radius:5px;background:var(--blue);color:#fff;
       font-family:inherit;font-weight:700;font-size:15px;line-height:1;letter-spacing:-.02em;
       cursor:pointer}
  .btn.g{background:#eef1f4;color:var(--ink2)}
  .ai{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;
      user-select:none;margin-right:4px}
  .ai input{display:none}
  .ai .sw{width:38px;height:22px;border-radius:11px;background:#d6dce1;position:relative;transition:.15s}
  .ai .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
                 background:#fff;transition:.15s}
  .ai input:checked+.sw{background:var(--green)}
  .ai input:checked+.sw::after{transform:translateX(16px)}
  /* 칩이 나타났다 사라질 때 제목 줄 높이가 바뀌면 카드 안의 모든 것이 밀린다.
     칩 높이를 고정하고 제목 줄에 같은 높이를 미리 비워 둔다(.card>h2의 min-height) */
  .aichip{margin-left:auto;display:none;align-items:center;height:22px;gap:4px;background:#e6f7f6;
          color:#00847d;border-radius:4px;padding:0 9px;font-size:12px;font-weight:800;cursor:pointer}
  .ai-read{font-size:13px;line-height:1.75;user-select:text}
  .ai-read b{color:#00847d}
  body.aion .aichip{display:inline-flex}
  .goal{max-width:760px;text-align:right;line-height:1.45}
  body.aion .goal{color:#00847d;font-weight:700}
  .pop{position:fixed;max-width:420px;background:#0d3b39;color:#eafcfb;font-size:12.5px;line-height:1.6;
       padding:12px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.22);opacity:0;
       pointer-events:none;transition:.12s;z-index:120}
  .pop.on{opacity:1}
  .pop b{color:#7fe6e0}

  /* 요약 스트립 */
  .strip{display:flex;align-items:center;background:#fff;border-bottom:1px solid var(--line);padding:0 26px;gap:0}
  .st{padding:0 22px;border-right:1px solid var(--line);display:flex;align-items:baseline;gap:8px;height:34px}
  .st:first-child{padding-left:0}
  .st:last-child{border-right:0}
  .st .l{font-size:12px;color:var(--ink3);font-weight:600}
  .st .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .st .v small{font-size:12px;font-weight:700;color:var(--ink2);margin-left:2px}
  /* 숫자가 아닌 값은 같은 크기로 두면 줄을 밀어낸다. 다만 글자를 줄이면 기준선이 함께
     올라와 옆 칸과 어긋나므로, 보이지 않는 20px 글자를 하나 세워 기준선을 붙잡아 둔다 */
  .st .v.txt{font-size:15px}
  .st .v.txt::before{content:"";font-size:20px}
  .strip .sp{flex:1}
  /* AI 분석모드를 켰을 때만 뜨는 주의 문구 — 켜지 않았으면 경고할 대상이 없다 */
  .aicaution{display:none;font-size:12px;font-weight:700;color:#00847d}
  body.aion .aicaution{display:block}
  /* 부문 정렬 전환 — 건수와 사람 수 중 무엇으로 볼지는 담당자가 고른다.
     흰 알약은 배경을 갈아 끼우는 대신 하나가 미끄러져 옮겨 간다 */
  .sortsw{position:relative;display:inline-flex;gap:2px;margin-left:9px;background:#eef1f4;
          border-radius:6px;padding:2px}
  .sortsw .knob{position:absolute;left:0;top:2px;bottom:2px;width:0;border-radius:4px;background:#fff;
                box-shadow:0 1px 2px rgba(22,24,26,.14);
                transition:transform .34s cubic-bezier(.34,1.56,.64,1),width .34s cubic-bezier(.34,1.56,.64,1)}
  .sortsw b{position:relative;z-index:1;font-size:10.5px;font-weight:700;color:var(--ink3);
            padding:2px 8px;border-radius:4px;cursor:pointer;transition:color .18s,transform .12s}
  .sortsw b.on{color:var(--blue)}
  .sortsw b:active{transform:scale(.92)}

  /* 본문 */
  .grid{display:grid;grid-template-columns:380px 1fr 380px;gap:14px;padding:14px 26px 20px;min-height:0}
  .col{display:grid;gap:14px;min-height:0}
  .col.l{grid-template-rows:1fr auto auto}
  .col.m{grid-template-rows:auto auto 1fr}
  /* 아래 줄은 좁은 교차표와 유형 목록이 나눠 쓴다 */
  .pair{display:grid;grid-template-columns:296px 1fr;gap:14px;min-height:0}
  /* 부문 × 연령대 교차 */
  .hm{display:grid;grid-template-columns:40px repeat(4,1fr);gap:2px;align-content:start}
  .hm .hh{font-size:10.5px;color:var(--ink3);font-weight:700;text-align:center;padding-bottom:2px}
  .hm .rl{font-size:11.5px;font-weight:700;display:flex;align-items:center}
  .hm .cell{height:19px;border-radius:4px;display:grid;place-items:center;font-size:11.5px;
            font-weight:800;cursor:pointer}
  .hm .cell:hover{outline:2px solid var(--blue);outline-offset:-2px}
  .card{background:var(--card);border-radius:12px;padding:15px 17px;display:flex;flex-direction:column;min-height:0}
  .card>h2{font-size:14px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;
           min-height:22px}
  .card>h2 em{font-style:normal;font-size:11.5px;color:var(--ink3);font-weight:600}
  .card>h2 .r{margin-left:auto;font-size:11.5px;color:var(--ink3);font-weight:600}
  .card .body{margin-top:12px;flex:1;min-height:0}

  /* 지도 */
  .mapwrap{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:14px}
    .sea{flex:1;min-height:0;background:#e8eef4;border-radius:10px;overflow:hidden;position:relative}
  /* 이어도를 따로 그리듯, 바다 경계를 상자의 왼쪽·아래 변으로 삼는다.
     크기는 본토와 겹치지 않도록 지도 좌표계에 맞춰 스크립트가 정한다 */
  .onjin{position:absolute;left:0;bottom:0;background:#e8eef4;
         border-top:1.2px solid #16181a;border-right:1.2px solid #16181a;cursor:pointer}
  .onjin svg{width:100%;height:100%;display:block}
  .onjin b{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
           align-items:center;gap:1px;font-size:13px;font-weight:800;color:#16181a;
           text-shadow:0 0 3px #e8eef4,0 0 3px #e8eef4,0 0 3px #e8eef4}
  .onjin b span{font-size:12px}
  .sea svg{width:100%;height:100%;display:block}
  .dist{cursor:pointer;transition:.12s}
  .dist:hover{filter:brightness(.93)}
  .dlab{font-size:14px;font-weight:800;pointer-events:none;paint-order:stroke;stroke-width:3.5px}

  .dnum{font-size:13px;font-weight:800;pointer-events:none;paint-order:stroke;stroke-width:3.5px}
  .scale{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11px;color:var(--ink3);font-weight:700}
  .scale i{flex:1;height:10px;border-radius:5px;border:1px solid #dfe4e9}

  /* 연령 */
  .agerow{display:grid;grid-template-columns:54px 1fr 42px;align-items:center;gap:8px;margin-bottom:7px}
  .agerow:last-child{margin-bottom:0}
  .agerow .lb{font-size:11.5px;color:var(--ink2);font-weight:600}
  .agerow .n{font-size:12px;font-weight:700;text-align:right}
  .track{height:16px;background:#f1f4f6;border-radius:4px;overflow:hidden}
  .fill{height:100%;border-radius:0 4px 4px 0}
  /* 연령대 한 칸 안에서 남자는 왼쪽 끝, 여자는 오른쪽 끝에서 자란다 */
  .agerow .track{display:flex;justify-content:space-between}
  .sex{height:100%;display:flex;align-items:center;font-size:10px;font-weight:800;color:#fff}
  .sex.m{background:var(--blue);border-radius:0 3px 3px 0;justify-content:flex-end;padding-right:4px}
  .sex.f{background:var(--green);border-radius:3px 0 0 3px;padding-left:4px}
  .lg{font-size:10.5px;font-weight:700;color:var(--ink2);margin-left:7px}
  .lg::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px}
  .lg.m::before{background:var(--blue)}
  .lg.f::before{background:var(--green)}

  /* 부문별 요구 (주인공) */
  .sect{display:grid;grid-template-columns:58px 1fr 88px;align-items:center;gap:10px;
        padding:5px 6px;border-radius:7px;cursor:pointer}
  .sect:hover{background:#f5f8fb}
  .sect.on{background:#eaf2fa}
  .sect .lb{font-size:13px;font-weight:700}
  .sect .n{font-size:11.5px;color:var(--ink3);font-weight:600;text-align:right;white-space:nowrap}
  .sect .n b{color:var(--ink);font-size:13px;font-weight:800;margin-right:2px}
  .sect .track{height:19px}

  /* 4축 — 가운데를 0으로 두고 좌우로 뻗으면 축마다 양끝이 들쭉날쭉해 서로 견줄 수 없다.
     막대는 모두 같은 폭으로 오른쪽에 세우고, 축 이름과 질문은 왼쪽에 크게 둔다 */
  .ax{display:grid;grid-template-columns:minmax(0,1fr) 680px;align-items:center;gap:20px;
      padding:9px 8px;cursor:pointer;border-radius:8px}
  .ax:hover{background:#f5f8fb}
  .ax.on{background:#eaf2fa}
  .ax .h b{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
  .ax .h span{display:block;font-size:12.5px;color:var(--ink3);font-weight:600;margin-top:3px}
  .ax .bar{display:flex;height:28px;border-radius:5px;overflow:hidden}
  .ax .seg{display:flex;align-items:center;height:100%}
  .ax .seg.l{background:var(--blue);border-right:2px solid #fff;padding-left:11px}
  .ax .seg.r{background:var(--green);justify-content:flex-end;padding-right:11px}
  .ax .cap{font-size:12px;font-weight:800;color:#fff;white-space:nowrap}

  /* 유형 */
  #types{display:grid;align-content:start;gap:1px}
  .ty{display:grid;grid-template-columns:50px 224px 1fr 150px 34px;gap:10px;align-items:center;
      padding:2px 6px;border-radius:7px;cursor:pointer}
  .ty:hover{background:#f5f8fb}
  .ty.on{background:#eaf2fa}
  .ty code{font-size:10px;color:var(--ink3);font-weight:800;letter-spacing:.06em}
  .ty .nm,.ty .ax4{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ty .nm{font-size:12px;font-weight:600}
  .ty .ax4{font-size:11px;color:var(--ink3);font-weight:600}
  .ty .n{font-size:11.5px;font-weight:700;text-align:right}

  /* 오른쪽 컨텍스트 패널 */
  .ctx{background:#fff;border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .ctx header{padding:15px 18px 12px;border-bottom:1px solid var(--line)}
  /* 아무것도 고르지 않은 상태 — 안내를 늘어놓지 않고 무엇을 하면 되는지만 남긴다 */
  .ctx .blank{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;
              gap:9px;text-align:center;padding:24px}
  .ctx.empty .blank{display:flex}
  .ctx.empty header,.ctx.empty .c{display:none}
  .ctx .blank b{font-size:25px;font-weight:800;letter-spacing:-.03em}
  .ctx .blank span{font-size:12.5px;color:var(--ink3);font-weight:600}
  .bk{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 10px 0 8px;margin-bottom:9px;
      border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink2);
      font-family:inherit;font-weight:700;font-size:12px;line-height:1;cursor:pointer;transition:.12s}
  .bk:hover{background:#f2f5f7;color:var(--ink)}
  .ctx header .k{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.02em}
  .ctx header h3{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .ctx header p{font-size:11.5px;color:var(--ink3);margin-top:3px}
  .ctx .c{padding:14px 18px 18px;overflow:auto;flex:1}
  .ctx .c::-webkit-scrollbar{width:5px}
  .ctx .c::-webkit-scrollbar-thumb{background:#dde2e6;border-radius:3px}
  .ctx h4{font-size:11px;font-weight:800;color:var(--ink3);margin:14px 0 6px;letter-spacing:.02em}
  .ctx h4:first-child{margin-top:0}
  .ctx .li{font-size:12.5px;line-height:1.6;padding:6px 0;border-bottom:1px solid #f2f5f7}
  .ctx .li:last-child{border-bottom:0}
  .ctx .li .m{font-size:10.5px;color:var(--ink3);font-weight:600;margin-top:2px}
  .ctx .q{background:#f6f9fb;border-radius:8px;padding:9px 11px;margin-bottom:7px;font-size:12px;line-height:1.55}
  .ctx .q .m{font-size:10.5px;color:var(--ink3);font-weight:600;margin-top:4px}
  .ctx table{width:100%;border-collapse:collapse;font-size:12px}
  .ctx td,.ctx th{padding:6px 7px;border-bottom:1px solid #f2f5f7;text-align:left}
  .ctx th{font-size:10.5px;color:var(--ink3);font-weight:700}
  .ctx td.num{text-align:right;font-weight:700}
  .ctx tbody tr{cursor:pointer}
  .ctx tbody tr:hover{background:#f6f9fb}
  .mrow{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:5px 0;
        border-bottom:1px solid #f2f5f7}
  .mrow:last-child{border-bottom:0}
  .mrow span{color:var(--ink3);font-weight:600}
  .mrow b{font-weight:700;text-align:right}
  .miss{color:#b4520a;font-weight:800}
  .note{background:#fff8ef;border-radius:8px;padding:10px 12px;font-size:11.5px;color:#8a4b09;line-height:1.55}
  .loc{display:inline-block;background:#fff1e3;color:#b4520a;border-radius:5px;padding:1px 6px;
       font-size:10.5px;font-weight:800;margin-right:4px}
  .pill{display:inline-block;background:#eef2f6;color:var(--ink2);border-radius:5px;padding:1px 6px;
        font-size:10.5px;font-weight:700;margin-right:4px}
  .tip{position:fixed;background:#16181a;color:#fff;font-size:12px;font-weight:600;padding:6px 9px;
       border-radius:6px;pointer-events:none;opacity:0;transition:.1s;z-index:99}
  .tip.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <div class="top">
    <span class="brand">유스플랜AI</span>
    <span class="t">청년 의견 관리 플랫폼</span>
    <span class="d" id="ranAt"></span>
    <span class="sp"></span>
    <label class="ai" id="aiToggle"><input type="checkbox" id="aiChk"><span class="sw"></span>AI 분석모드</label>
    <button class="btn g">제출본 목록</button>
    <button class="btn g" id="dl">원자료 내려받기</button>
    <button class="btn">자료 업데이트</button>
  </div>

  <div class="strip" id="strip"></div>

  <div class="grid">
    <div class="col l">
      <div class="card">
        <h2>자치구별 참여자수<span class="aichip" data-ai="map">AI 해석</span></h2>
        <div class="mapwrap" id="map"></div>
      </div>
      <div class="card">
        <h2>연령 구성 <span class="r"><span id="ageRange"></span>
          <span class="lg m">남</span><span class="lg f">여</span></span></h2>
        <div class="body" id="ages"></div>
      </div>
      <div class="card">
        <h2>조사 개요</h2>
        <div class="body" id="meta"></div>
      </div>
    </div>

    <div class="col m">
      <div class="card">
        <h2>계획 부문별 요구 <em>건수 · 언급한 사람</em>
          <span class="sortsw" id="topicSort"><i class="knob"></i><b class="on" data-k="1">건수순</b><b data-k="2">사람수순</b></span>
          <span class="aichip" data-ai="sect">AI 해석</span></h2>
        <div class="body" id="topics"></div>
      </div>
      <div class="card">
        <h2>도시가치 4축<span class="aichip" data-ai="axes">AI 해석</span></h2>
        <div class="body" id="axes"></div>
      </div>
      <div class="pair">
        <div class="card">
          <h2>연령대별 요구사항 <em>요구 건수</em><span class="aichip" data-ai="cross">AI 해석</span></h2>
          <div class="body hm" id="cross"></div>
        </div>
        <div class="card">
          <h2>내가 바라는 도시 유형 <em>4축 조합 · 인원</em><span class="aichip" data-ai="types">AI 해석</span></h2>
          <div class="body" id="types"></div>
        </div>
      </div>
    </div>

    <div class="ctx empty" id="ctx">
      <header><button class="bk" id="ctxBack">← 뒤로</button>
        <div class="k" id="ck"></div><h3 id="ct"></h3><p id="cs"></p></header>
      <div class="c" id="cc"></div>
      <div class="blank"><b>상세 보기</b><span>자세히 보고 싶은 항목을 선택하세요</span></div>
    </div>
  </div>
</div>

<script>

/* 인천 지도 — 2026년 7월 개편 경계를 단순화한 형상. 본토를 크게 보이도록 잘라 냈고
   화면 밖으로 나가는 옹진군은 좌측 아래 별도 박스로 둔다.
   지도 상자 크기를 재야 하므로 다른 카드가 다 채워진 뒤에 호출한다. */
function drawMap(){
  const counts=Object.values(D.regions), max=Math.max(...counts);
  // 흰색 → 인천 블루 한 색 그라데이션. 0명은 가장 옅은 쪽이다.
  const fill=n=>`rgb(${Math.round(255-(255-0)*n/max)},${Math.round(255-(255-94)*n/max)},${Math.round(255-(255-184)*n/max)})`;
  const ink=n=>n/max>0.55?'#fff':'#3d4448';
  const halo=n=>n/max>0.55?'rgba(0,50,100,.55)':'rgba(255,255,255,.85)';
  const IN=MAP.inset;                                 // 옹진군 삽입 지도
  const NUDGE={제물포구:[-16,-6]};   // 해안을 따라 좁은 구만 조금 밀어 준다
  let g='';
  MAP.d.forEach(d=>{
    const n=D.regions[d.name]||0;
    g+=`<path class="dist" data-d="${d.name}" data-n="${n}" d="${d.d}" fill="${fill(n)}"
          stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>`;
  });
  MAP.d.forEach(d=>{
    const n=D.regions[d.name]||0;
    const [dx,dy]=NUDGE[d.name]||[0,0];
    g+=`<text class="dlab" style="fill:${ink(n)};stroke:${halo(n)}" x="${d.x+dx}" y="${d.y+dy}" text-anchor="middle">${d.name}</text>`
     + `<text class="dnum" style="fill:${ink(n)};stroke:${halo(n)}" x="${d.x+dx}" y="${d.y+dy+17}" text-anchor="middle">${n}명</text>`;
  });
  const nOj=D.regions['옹진군']||0;
  const wrap=document.getElementById('map');
  wrap.innerHTML=`<div class="sea"></div>
    <div class="scale"><span>0명</span>
      <i style="background:linear-gradient(90deg,#fff,rgb(0,94,184))"></i>
      <span>${max}명</span></div>`;
  const sea=wrap.querySelector('.sea');
  /* 지도를 상자에 여백 없이 맞춘다. 여백이 남으면 강화군이 상자 안쪽에서 잘려
     잘린 자국이 그대로 보인다. 축척은 그대로 두고 남는 쪽으로만 viewBox를 늘린다. */
  const s=Math.min(sea.clientWidth/MAP.vw, sea.clientHeight/MAP.vh);
  const vw=sea.clientWidth/s, vh=sea.clientHeight/s;
  /* 옹진군 상자가 차지할 자리 — 연수구 남단(x 168)과 영종구(y 387)를 피한 크기 */
  const OJ=[142,130];

  sea.innerHTML=
   `<svg viewBox="0 0 ${vw} ${vh}" preserveAspectRatio="xMidYMid meet">
      <defs><clipPath id="clip"><rect width="${vw}" height="${vh}"/></clipPath></defs>
      <g clip-path="url(#clip)">${g}</g>
    </svg>
    <div class="onjin dist" data-d="옹진군" data-n="${nOj}"
         style="width:${OJ[0]*s}px;height:${OJ[1]*s}px">
      <svg viewBox="0 0 ${IN.w} ${IN.h}" preserveAspectRatio="xMidYMid meet">
        <path d="${IN.d}" fill="${fill(nOj)}" stroke="#16181a" stroke-width="0.6"/></svg>
      <b>옹진군<span>${nOj}명</span></b></div>`;

  document.querySelectorAll('.dist').forEach(el2=>{
    const n=+el2.dataset.n, nm=el2.dataset.d;
    hov(el2, n? `${nm} ${n}명` : `${nm} 참여자 없음`);
    el2.onclick=()=>showRegion(nm,n);
  });
}

/* 계획 부문별 요구 */
/* 건수 1위와 언급한 사람 1위가 갈리므로 어느 쪽으로 볼지 고를 수 있어야 한다 */
function drawTopics(k){
  const rows=[...D.topics].sort((a,b)=>b[k]-a[k]);
  const mx=rows[0][k];
  const box=document.getElementById('topics');
  box.innerHTML='';
  rows.forEach(([t,cnt,ppl])=>{
    const r=el(`<div class="sect" data-t="${t}">
      <div class="lb">${t}</div>
      <div class="track"><div class="fill" style="width:${rows.find(x=>x[0]===t)[k]/mx*100}%;background:var(--blue)"></div></div>
      <div class="n"><b>${k===1?cnt:ppl}</b>${k===1?'건 · '+ppl+'명':'명 · '+cnt+'건'}</div></div>`);
    hov(r,`${t} (${SECT[t]}) — 요구 ${cnt}건, 12명 중 ${ppl}명이 언급`);
    r.onclick=()=>showTopic(t,cnt,ppl);
    box.append(r);
  });
}
drawTopics(1);
{
  const sw=document.getElementById('topicSort'), knob=sw.querySelector('.knob');
  /* 알약을 켜진 칸에 맞춰 옮긴다. 두 칸의 글자 수가 달라 폭도 함께 따라간다 */
  const slide=instant=>{const b=sw.querySelector('b.on');
    if(instant) knob.style.transition='none';   // 첫 배치까지 미끄러지면 로딩이 어수선해진다
    knob.style.width=b.offsetWidth+'px';
    knob.style.transform=`translateX(${b.offsetLeft}px)`;
    if(instant) requestAnimationFrame(()=>knob.style.transition='');};
  sw.onclick=e=>{
    const b=e.target.closest('b[data-k]');
    if(!b || b.classList.contains('on')) return;
    sw.querySelectorAll('b').forEach(n=>n.classList.toggle('on',n===b));
    slide();
    drawTopics(+b.dataset.k);
  };
  slide(true);
}

const ctxBox=document.getElementById('ctx');
function ctx(kind,title,sub,html,sel){
  document.getElementById('ck').textContent=kind;
  document.getElementById('ct').textContent=title;
  document.getElementById('cs').textContent=sub;
  document.getElementById('cc').innerHTML=html;
  document.querySelectorAll('.sect.on,.ax.on,.ty.on').forEach(n=>n.classList.remove('on'));

  ctxBox.classList.remove('empty');
}

    `<h4>이 부문으로 들어온 요구</h4>`+
    `<div class="li" style="color:#b4520a;font-weight:700">언급 장소 확보 0건 — 요구별 장소 추출은 다음 단계입니다</div>`+
    items.map(({p,d})=>`<div class="li">${d.title}
      <div class="m">${p.region} · ${p.age}세 ${d.topics.filter(x=>x!==t).map(x=>`<span class="pill">${x}</span>`).join('')}</div></div>`).join('')
,
    `.sect[data-t="${t}"]`);
}
function showAxis(ax){
  const m=AX[ax], s=D.axis_stats.find(x=>x.axis===ax), su=D.axis_summaries.find(x=>x.axis===ax);
  let h=`<h4>수치</h4><table><tr><th>극</th><th style="text-align:right">인원</th></tr>`+
    s.poles.map(p=>`<tr><td>${m.p[p.letter]}</td><td class="num">${p.count}명</td></tr>`).join('')+'</table>';
  su.poles.forEach(p=>{ h+=`<h4>${m.p[p.letter]} 쪽 요구 경향</h4>`;
    p.sentences.forEach(x=>h+=`<div class="li">${x}</div>`); });
  h+='<h4>청년들이 실제로 한 말</h4>'+
    su.quotes.map(q=>`<div class="q">“${q.text}”</div>`).join('');
  ctx('도시가치 축', m.t, m.q, h, `.ax[data-a="${ax}"]`);
}
function showRegion(name,n){
  const ppl=D.people.filter(p=>p.region===name);
  ctx('군·구', name, n? `${n}명 참여` : '아직 참여자가 없습니다',
    n ? '<table><thead><tr><th>별명</th><th>나이</th><th>도시 유형</th></tr></thead><tbody>'+
        ppl.map(p=>`<tr data-i="${D.people.indexOf(p)}"><td>${p.nickname}</td><td class="num">${p.age}</td><td>${p.nick}</td></tr>`).join('')+
        '</tbody></table><h4>이 지역에서 나온 요구</h4>'+
        ppl.flatMap(p=>p.demands.map(d=>`<div class="li">${d.title}<div class="m">${p.nickname} · ${d.topics.map(x=>`<span class="pill">${x}</span>`).join('')}</div></div>`)).join('')
      : `<div class="note">이 군·구에서는 아직 참여자가 없습니다. 홍보를 어디에 더 해야 하는지 판단하는 근거로 씁니다.</div>`);
  bindPeople();
}
function showType(c,nick,n){
  const ppl=D.people.filter(p=>p.code===c);
  ctx('내가 바라는 도시 유형', nick, `${spell(c)} · ${n}명`,
    '<h4>이 유형으로 나온 사람</h4>'+
    ppl.map(p=>`<div class="li">${p.summary}<div class="m">${p.nickname} · ${p.region} · ${p.age}세</div></div>`).join(''),
    `.ty[data-c="${c}"]`);
}
function showPerson(p){
  ctx('참여자', p.nickname, `${p.region} · ${p.age}세 · ${p.nick}`,
    `<h4>인터뷰 요약</h4><div class="li">${p.summary}</div>
     <h4>축별 판정 이유</h4>`+
    p.reasons.map(r=>`<div class="li">${r.reason}<div class="m">${AX[r.axis].t}</div></div>`).join('')+
    `<h4>이 사람이 낸 요구 ${p.demands.length}건</h4>`+
    p.demands.map(d=>`<div class="li">${d.title}<div class="m">${d.topics.map(x=>`<span class="pill">${x}</span>`).join('')}</div></div>`).join('')+
    `<div class="note" style="margin-top:14px">목업입니다. 실제로는 여기서 원본 대화록 전문으로 이어집니다.</div>`);
}
/* AI 해석 — 실제 구현에서는 분석 실행 때 집계와 해설을 함께 넣어 한 번 생성해 저장한다 */
const AI={
 map:'참여가 <b>검단구·제물포구·옹진군</b> 세 곳에서 0명입니다. 원도심과 도서 지역이 통째로 비어 있어, 지금 수치를 인천 청년 전체의 의견으로 읽으면 안 됩니다. 홍보 경로를 이 세 지역에 먼저 넣는 것이 표본을 넓히는 가장 빠른 방법입니다.',
 sect:'건수 1위는 상권(16건)이지만 <b>언급한 사람 수로는 교통·일자리가 11명</b>으로 가장 넓습니다. 상권은 소수가 여러 번 말한 주제이고, 교통과 일자리는 거의 모두가 한 번씩 말한 주제입니다. 계획서에 우선순위를 적을 때는 뒤쪽이 더 강한 근거입니다. 교육은 4건·4명으로 가장 얇아, 질문이 닿지 않은 것인지 실제 관심이 낮은 것인지 확인이 필요합니다.',
 axes:'네 축 중 <b>발전 가치만 9대 3으로 뚜렷하게 기울었습니다.</b> 보존을 원하는 청년이 압도적으로 보이지만, 인터뷰 마무리에 "그대로 남았으면 하는 것"을 묻는 문항이 있어 답이 보존 쪽으로 끌렸을 가능성이 있습니다. 이 수치는 정책 근거로 쓰기 전에 질문 방식을 함께 검토해야 합니다. 나머지 세 축은 6대 6에서 8대 4 사이로, 인천 청년의 지향이 하나로 모이지 않는다는 뜻입니다.',
 cross:'<b>19~24세는 상권(7건), 35~39세는 안전(6건)과 환경(5건)</b>에 몰립니다. 같은 청년이라도 생애주기에 따라 도시에 요구하는 것이 갈립니다. 청년 정책을 하나의 묶음으로 설계하면 두 집단 모두 만족하지 못할 수 있습니다.',
 types:'12명이 서로 다른 유형 <b>9개</b>로 흩어졌고 가장 많은 유형도 3명입니다. 이 표본으로 인천 청년의 대표 유형을 말할 단계는 아닙니다. 다만 9개 유형 중 6개(9명)가 이야기(H)로 끝나, 4축에서 본 보존 쏠림이 조합에서도 그대로 나타납니다.'
};
const AITITLE={map:'자치구별 참여자수',sect:'계획 부문별 요구',axes:'도시가치 4축',
               cross:'연령대별 요구사항',types:'내가 바라는 도시 유형'};
document.querySelectorAll('.aichip').forEach(c=>{
  c.onclick=()=>ctx('AI 해석', AITITLE[c.dataset.ai], '이 카드의 수치가 무엇을 시사하는가',
    `<div class="ai-read">${AI[c.dataset.ai]}</div>
     <div class="note" style="margin-top:14px">AI가 이번 분석 결과와 축 해설을 함께 읽고 쓴 문장입니다. 그대로 복사해 보고자료에 쓸 수 있습니다. 판단의 근거는 왼쪽 수치이며, 인용 전에 수치를 함께 확인하십시오.</div>`);
});
document.getElementById('aiChk').onchange=e=>{
  document.body.classList.toggle('aion', e.target.checked);
};

/* 조사 개요 — 조사 기간은 제출본에 찍힌 응답 시각의 최소·최대를 그대로 쓴다 */
{
  const ds=D.people.map(p=>new Date(p.at)).sort((a,b)=>a-b);
  const f=d=>d.toLocaleDateString('ko-KR',{month:'long',day:'numeric'});
  document.getElementById('meta').innerHTML=[
    ['조사 성격', '도시기본계획에 대한 청년층 의견 수렴'],
    ['조사 기간', f(ds[0])+' ~ '+f(ds[ds.length-1])],
    ['조사 방법', '유스플랜AI를 활용한 1:1 인터뷰'],
    ['모집 경로', '인천시청 홈페이지 및 SNS를 통한 QR코드 홍보']
  ].map(([k2,v])=>`<div class="mrow"><span>${k2}</span><b>${v}</b></div>`).join('');
}

/* 원자료 내려받기 — 요구 전수를 표로 뽑는다. 백엔드 없이 화면의 데이터로 만든다 */
document.getElementById('dl').onclick=()=>{
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const rows=[['참여자','거주 군·구','나이','계획 부문','요구','언급 장소']];
  D.people.forEach((p,i)=>{
    const id='P'+String(i+1).padStart(2,'0');
    p.demands.forEach(d=>d.topics.forEach(t=>rows.push([id,p.region,p.age,t,d.title,''])));
  });
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],
                      {type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='유스플랜AI_청년의견_원자료.csv'; a.click();
  URL.revokeObjectURL(a.href);
};

drawMap();
</script>
